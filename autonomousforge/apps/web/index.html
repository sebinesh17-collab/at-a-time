<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="AUTONOMOUSFORGE - Private Autonomous Multi-Agent Software Engineering OS">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AUTONOMOUSFORGE">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Cloud Configuration Meta Tags (populated at deploy time) -->
    <meta name="af-theme-mode" content="purple">
    <meta name="af-primary-color" content="#7c3aed">
    <meta name="af-accent-color" content="#a855f7">
    <meta name="af-api-domain" content="">
    <meta name="af-api-base" content="/api">
    <meta name="af-ws-base" content="/ws">
    <meta name="af-cloudflare-deploy" content="false">
    <meta name="af-cloudflare-pages" content="false">
    <meta name="af-cloudflare-worker" content="false">
    <meta name="af-d1-database-id" content="">
    <meta name="af-hyperdrive-enabled" content="false">
    <meta name="af-kv-enabled" content="false">
    <meta name="af-r2-enabled" content="false">
    <meta name="af-workers-ai-enabled" content="false">

    <title>AUTONOMOUSFORGE</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forge: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        accent: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'pulse-soft': 'pulseSoft 2s infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        },
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-forge-950 text-forge-50 min-h-screen font-sans antialiased">
    <!-- App Root -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Dynamic page content will be injected here -->
    </div>

    <!-- Cloud Configuration Script (loads first for auto-detection) -->
    <script src="/js/cloud-config.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>

    <!-- Main App Script -->
    <script type="module" src="/js/main.js"></script>
</body>
</html>
